[package]
name = "copied-md-desktop"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/0xdoublesharp/copied.md"

[[bin]]
name = "copied-md"
path = "src/main.rs"

[lib]
name = "copied_md_desktop"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
copied-core = { path = "../../../crates/copied-core" }
copied-config = { path = "../../../crates/copied-config" }
copied-clipboard = { path = "../../../crates/copied-clipboard" }
copied-platform = { path = "../../../crates/copied-platform" }
copied-engine = { path = "../../../crates/copied-engine" }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSObjCRuntime", "NSValue", "NSString", "NSUserDefaults"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
