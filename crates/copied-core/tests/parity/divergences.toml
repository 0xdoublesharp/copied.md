# Intentional differences between copied-core and the frozen ts-oracle-v1
# TypeScript engine (tests/golden/corpus.json).
#
# tests/parity.rs checks every golden case field by field:
#   * a field that differs from the oracle must be covered by an entry below
#     (matching target, field, and case) and must equal the reviewed value in
#     tests/parity/improved.json;
#   * every entry must still differ from the oracle for at least one covered
#     field, so stale entries fail;
#   * every other field must equal the oracle exactly.
#
# Keys: id, title, rationale (multi-line """ strings allowed), targets, fields
# (text/plain, text/html, text/rtf, text/signal, diagnostics, metrics), cases.
# Unknown keys are rejected.

[[divergence]]
id = "nested-emphasis-markers"
title = "Do not repeat bold, italic, or strike markers inside the same style"
rationale = """
The oracle wraps every strong, emphasis, and delete node, so a bold run inside a
heading (which is already bold) or inside another bold run produced
`**Bold* heading*` in Slack mrkdwn and WhatsApp, which both apps render with
stray asterisks, and `<strong><strong>` in Telegram and Signal HTML. The
renderer now tracks the active bold, italic, and strike state and only emits a
marker when the style turns on, giving `*Bold heading*` and
`<strong>Bold heading</strong>`.
"""
targets = ["slack-api", "whatsapp", "telegram", "signal"]
fields = ["text/plain", "text/html", "text/signal", "metrics"]
cases = ["headings-and-styles"]

[[divergence]]
id = "telegram-native-markdown"
title = "Telegram plain text uses native Markdown"
rationale = """
Telegram for macOS recognizes its double emphasis delimiters, inline code,
and fenced code in plain text. The renderer uses these markers for headings
and styles, and closes emphasis around inline code so the code delimiters
can be parsed as an independent entity. The outer emphasis wins when styles
overlap. The decorative Unicode preference still uses the Unicode renderer.
"""
targets = ["telegram"]
fields = ["text/plain", "metrics"]
cases = ["whitespace-only", "clipboard-fidelity", "headings-and-styles", "tables-gfm-and-html", "code-blocks-and-backticks", "telegram-rtf-unicode-and-tabs", "x-weighted-length"]

[[divergence]]
id = "telegram-omit-rtf"
title = "Telegram clipboard payloads use HTML and plain text"
rationale = """
Telegram for macOS prioritizes RTF, whose standard text attributes do not
carry the native message entities through its paste path. Excluding RTF lets
macOS use the native Markdown in plain text, while clients that accept HTML
still receive rich content.
"""
targets = ["telegram"]
fields = ["text/rtf"]
cases = ["whitespace-only", "clipboard-fidelity", "headings-and-styles", "links-and-urls", "images-and-linked-images", "lists-and-tasks", "footnotes-and-hr", "tables-gfm-and-html", "code-blocks-and-backticks", "blockquotes-nested", "signal-spoilers-valid", "signal-spoilers-malformed", "telegram-rtf-unicode-and-tabs", "x-weighted-length", "raw-html-sanitization"]

[[divergence]]
id = "telegram-native-spoilers"
title = "Telegram spoilers use native HTML and Markdown with a fail-closed fallback"
rationale = """
The oracle ignored `<span data-spoiler="true">` for Telegram, so spoiler text
was pasted in the clear. HTML uses `<tg-spoiler>` and plain text uses `||`.
When a spoiler cannot be recognized as its own Markdown entity or decorative
Unicode is selected, plain text shows `[spoiler omitted]` with an info
diagnostic. A malformed spoiler fails closed on both surfaces with a warning,
using the same validity rules as Signal.
"""
targets = ["telegram"]
fields = ["text/plain", "text/html", "diagnostics", "metrics"]
cases = ["clipboard-fidelity", "signal-spoilers-valid", "signal-spoilers-malformed"]

[[divergence]]
id = "discord-reddit-native-spoilers"
title = "Discord ||spoilers|| and Reddit >!spoilers!< with fail-closed fallback"
rationale = """
The oracle stripped the span and copied spoiler text verbatim to Discord and
Reddit, both of which have native spoiler syntax. Valid spoilers now become
`||text||` (Discord) or `>!text!<` (Reddit). When the destination cannot hold
the spoiler (inside a code block or table code block, across paragraphs for
Reddit, or containing the closing delimiter) the content is replaced with
`[spoiler omitted]` and an info diagnostic. Malformed spoilers are always
replaced with a warning, and dangling emphasis markers are re-closed.
"""
targets = ["discord", "reddit"]
fields = ["text/plain", "diagnostics", "metrics"]
cases = ["clipboard-fidelity", "signal-spoilers-valid", "signal-spoilers-malformed"]

[[divergence]]
id = "aligned-monospace-tables"
title = "Aligned columns for tables shown in monospace"
rationale = """
Slack paste, Discord, and WhatsApp cannot show real tables, so the oracle
flattened them to `a | b` rows whose columns never lined up, and Discord kept
literal backslash-pipe escapes inside a code block where they are shown as-is. These
destinations now pad every column but the last to its widest cell (East Asian
wide characters count twice), add a dashed rule under the header row, keep
captions and safe link URLs, and drop pipe escapes inside monospace. WhatsApp
tables move into a triple-backtick block and fall back to the old rows when a
cell contains a triple backtick.
"""
targets = ["slack-paste", "discord", "whatsapp"]
fields = ["text/plain", "text/html", "metrics"]
cases = ["clipboard-fidelity", "tables-gfm-and-html"]

[[divergence]]
id = "slack-api-code-table-pipes"
title = "Slack API table cells keep literal pipes inside code blocks"
rationale = """
Slack displays backslashes literally in fenced code blocks. Removing the
table pipe escape preserves cell content and the pipe in mrkdwn link syntax.
"""
targets = ["slack-api"]
fields = ["text/plain", "metrics"]
cases = ["clipboard-fidelity", "tables-gfm-and-html"]

[[divergence]]
id = "teams-word-quote-and-code-styles"
title = "Teams and Word preserve contrast and header alignment"
rationale = """
Teams and Word drop the default browser styling of `<blockquote>` and render
code with no visual separation, so pasted quotes looked like ordinary
paragraphs. Inline styles added after sanitization use a translucent neutral
quote border and translucent backgrounds for code and Word table headers.
These colors work with the destination's foreground on light and dark
surfaces. Header text alignment follows the sanitized GFM column alignment.
"""
targets = ["teams", "word"]
fields = ["text/html"]
cases = ["whitespace-only", "clipboard-fidelity", "headings-and-styles", "tables-gfm-and-html", "code-blocks-and-backticks", "blockquotes-nested", "signal-spoilers-valid", "telegram-rtf-unicode-and-tabs"]

[[divergence]]
id = "task-list-checkbox-glyphs"
title = "Visible checkbox glyphs for task lists in Rich Text, Slack, Teams, and Word"
rationale = """
Rich text paste surfaces may strip `<input type="checkbox">`, removing the
done/open state of GFM task items. A visible `☑` or `☐` glyph keeps that state
and the single space before the item text. HTML Source keeps semantic inputs.
"""
targets = ["rich-text", "slack-paste", "teams", "word"]
fields = ["text/html"]
cases = ["lists-and-tasks"]

[[divergence]]
id = "markdown-html-block-separation"
title = "Raw HTML blocks stay separate blocks in Discord and Reddit Markdown"
rationale = """
The oracle replaced every raw HTML block with a bare text node. Because the
root then contained phrasing content, mdast-util-to-markdown joined all
top-level blocks flush, producing text such as `after.Block` and leaving a
table's code fence followed directly by text, so Discord never closed the code
block. HTML blocks now become their own paragraphs (trailing whitespace
trimmed, empty ones dropped), so blocks keep their blank-line separation and a
native spoiler can never end up inside an unclosed code block.
"""
targets = ["discord", "reddit"]
fields = ["text/plain", "metrics"]
cases = ["signal-spoilers-valid", "tables-gfm-and-html"]

[[divergence]]
id = "reddit-indented-code"
title = "Four-space code blocks for Old and New Reddit"
rationale = """
Reddit renders block code using indentation, including within list and quote
containers. Old Reddit supports this form. A blank line lets code follow
paragraphs and a thematic break keeps separate code blocks or a list followed
by a code block from merging. List items that start with code get a visually
empty first paragraph so Old Reddit parses their block structure.
"""
targets = ["reddit"]
fields = ["text/plain", "metrics"]
cases = ["whitespace-only", "clipboard-fidelity", "code-blocks-and-backticks", "telegram-rtf-unicode-and-tabs"]
