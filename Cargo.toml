[workspace]
resolver = "3"
members = [
  "crates/copied-codec",
  "crates/copied-core",
  "crates/copied-config",
  "crates/copied-clipboard",
  "crates/copied-platform",
  "crates/copied-engine",
  "crates/copied-cli",
  "crates/copied-wasm",
]
exclude = [
  "fuzz",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/0xdoublesharp/copied.md"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
copied-codec = { path = "crates/copied-codec" }
copied-core = { path = "crates/copied-core" }
copied-config = { path = "crates/copied-config" }
copied-clipboard = { path = "crates/copied-clipboard" }
copied-platform = { path = "crates/copied-platform" }
copied-engine = { path = "crates/copied-engine" }

clap = { version = "4", features = ["derive"] }
directories = "6"
html5ever = "0.27"
indexmap = { version = "2", features = ["serde"] }
markdown = "1"
markup5ever_rcdom = "0.3"
proptest = "1"
proptest-state-machine = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"
wasm-bindgen = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry"] }
x11rb = { version = "0.13", features = ["xfixes"] }
