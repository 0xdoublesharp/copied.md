name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Tests, fuzzing, and coverage
        run: pnpm test:coverage

      - name: Package (Chrome)
        run: pnpm zip

      - name: Package (Firefox)
        run: pnpm zip:firefox

      - name: Package (Edge)
        run: pnpm zip:edge

      - name: Package (VS Code)
        run: pnpm package:vscode

      - name: Package (CLI and MCP)
        run: pnpm package:cli

  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: macOS clipboard and runtime tests
        run: pnpm test:macos
