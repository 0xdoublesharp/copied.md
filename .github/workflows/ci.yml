name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Package (Chrome)
        run: pnpm zip

      - name: Package (Firefox)
        run: pnpm zip:firefox

      - name: Package (Edge)
        run: pnpm zip:edge

      - name: Package (VS Code)
        run: pnpm package:vscode

      - name: Package (CLI and MCP)
        run: pnpm package:cli
